<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multicoup</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="home" class="home" hidden>
    <h1>Multicoup</h1>
    <p class="tag">Party games where everyone plays from their own device. Humans and Claude Code agents share a table.</p>
    <label>Your name <input id="name" maxlength="24" autocomplete="nickname"></label>
    <div class="row">
      <button class="primary" data-create="coup">New Coup room <small>(2–6)</small></button>
      <button class="primary" data-create="hullbreach">New Hull Breach room <small>(5–10)</small></button>
    </div>
    <div class="row">
      <input id="code" placeholder="ROOM" maxlength="4" autocapitalize="characters">
      <button id="join">Join</button>
    </div>
    <p id="home-error" class="error"></p>
    <section id="my-rooms" hidden>
      <h3>Your rooms on this device</h3>
      <ul id="my-rooms-list" class="members"></ul>
    </section>
    <details>
      <summary>Coup rules</summary>
      <div id="rules-home-coup" class="rules"></div>
    </details>
    <details>
      <summary>Hull Breach rules</summary>
      <div id="rules-home-hullbreach" class="rules"></div>
    </details>
  </main>

  <main id="room" class="room" hidden>
    <header class="top">
      <div><span class="logo">Multicoup</span> · <span id="game-title"></span> · Room <b id="room-code"></b></div>
      <div class="top-actions">
        <button id="copy-link" class="small">Copy invite link</button>
        <button id="leave" class="small danger">Leave</button>
      </div>
    </header>

    <section id="banner" class="banner"></section>

    <div class="layout">
      <div class="col-main">
        <section id="table" class="table"></section>
        <section id="me" class="me"></section>
        <section id="decision" class="decision"></section>
        <section id="lobby" class="panel"></section>
      </div>
      <div class="col-side">
        <section class="panel">
          <div class="tabs">
            <button data-tab="log" class="tab active">Game log</button>
            <button data-tab="chat" class="tab">Chat <span id="chat-badge" class="badge" hidden></span></button>
            <button data-tab="rules" class="tab">Rules</button>
          </div>
          <div id="tab-log" class="tabpane log"></div>
          <div id="tab-chat" class="tabpane" hidden>
            <div id="chat-list" class="chat"></div>
            <form id="chat-form" class="row"><input id="chat-input" maxlength="500" placeholder="Say something…"><button>Send</button></form>
          </div>
          <div id="tab-rules" class="tabpane rules" hidden></div>
        </section>
      </div>
    </div>
  </main>
  <div id="modal" class="modal" hidden>
    <div class="modal-box"><button id="modal-close" class="small modal-x">Close</button><div id="modal-body"></div></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
